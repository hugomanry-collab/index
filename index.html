<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JapVocab Companion - 80 Kanjis N5</title>
    <style>
        :root {
            --primary: #007aff;
            --success: #34c759;
            --warning: #ff9500;
            --danger: #ff3b30;
            --bg: #f2f2f7;
            --card-bg: #ffffff;
            --text: #1c1c1e;
            --text-secondary: #8e8e93;
            --border: #c7c7cc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 0;
            color: var(--text);
            padding-bottom: 90px;
        }

        header {
            background: var(--card-bg);
            padding: 15px 20px;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            flex: 1;
            text-align: center;
        }

        /* Bouton icône de sélection de grille */
        .grid-toggle-icon {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 4px;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        .card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-content .kanji {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
        }

        .card-content .kana {
            color: var(--text-secondary);
            font-size: 14px;
            margin-left: 6px;
        }

        .card-content .translation {
            font-size: 15px;
            margin-top: 4px;
        }

        .card-stats {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        .delete-btn {
            background: #ffe5e5;
            color: var(--danger);
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-size: 16px;
            box-sizing: border-box;
            background: var(--card-bg);
            color: var(--text);
        }

        button.action-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            background: var(--primary);
            color: white;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        
        button.action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.sync-btn {
            background: var(--success);
            margin-top: 25px;
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        nav button {
            background: none;
            border: none;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        nav button.active {
            color: var(--primary);
            font-weight: 700;
        }

        nav button span.icon {
            font-size: 20px;
        }

        .quiz-box {
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.05);
        }
        .quiz-word {
            font-size: 36px;
            font-weight: bold;
            color: var(--primary);
            margin: 20px 0;
        }
        .quiz-feedback {
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
        }

        /* Modal de la grille interactive type image */
        #gridModal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        #gridModal.active {
            display: flex;
        }
        .modal-content {
            background: #f9f9f9;
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            box-sizing: border-box;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .modal-header h3 {
            margin: 0;
            font-size: 18px;
        }
        .close-modal-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .kanji-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
            text-align: center;
            margin-bottom: 15px;
        }
        .grid-cell {
            aspect-ratio: 1;
            background: #ffffff;
            border: 2px solid var(--border);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            user-select: none;
            transition: all 0.15s ease;
        }
        /* Style sélectionné : entouré de bleu et un peu plus gros */
        .grid-cell.selected {
            border-color: var(--primary);
            background: #eef5ff;
            color: var(--primary);
            transform: scale(1.12);
            box-shadow: 0 4px 10px rgba(0, 122, 255, 0.2);
            z-index: 2;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
        }
        .modal-actions button {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <div style="width: 30px;"></div>
        <div class="header-title" id="headerTitle">📚 Kanjis JLPT N5 (80)</div>
        <!-- Petite icône dans un coin pour ouvrir le menu grille -->
        <button class="grid-toggle-icon" onclick="openGridModal()" title="Sélectionner les kanjis">🎛️</button>
    </header>

    <div class="container">
        
        <!-- VUE 1 : LISTE / REVISION -->
        <div id="view-list" class="view active">
            <h2>Mes kanjis enregistrés</h2>
            <div id="wordList"></div>
            <button class="action-btn sync-btn" onclick="syncToESP32()">🔄 Synchroniser avec l'ESP32</button>
        </div>

        <!-- VUE 2 : AJOUTER -->
        <div id="view-add" class="view">
            <h2>Ajouter un kanji</h2>
            <div class="form-group">
                <label>Kanji</label>
                <input type="text" id="kanji" placeholder="ex: 一">
            </div>
            <div class="form-group">
                <label>Kana (Lecture)</label>
                <input type="text" id="kana" placeholder="ex: ひと">
            </div>
            <div class="form-group">
                <label>Traduction française</label>
                <input type="text" id="translation" placeholder="ex: un">
            </div>
            <button class="action-btn" onclick="addWord()">Enregistrer</button>
        </div>

        <!-- VUE 3 : QUIZ INTERACTIF -->
        <div id="view-quiz" class="view">
            <h2>Quiz de révision</h2>
            <div class="quiz-box">
                <p style="color:var(--text-secondary)" id="quizPromptLabel">Traduis en français :</p>
                <div class="quiz-word" id="quizPrompt"></div>
                
                <div class="form-group" style="text-align: left; margin-top: 20px;">
                    <input type="text" id="userAnswerInput" placeholder="Ta réponse..." autocomplete="off">
                </div>
                <button class="action-btn" id="quizActionBtn" onclick="handleQuizAction()">Valider</button>
                <div class="quiz-feedback" id="quizFeedback"></div>
            </div>
        </div>

    </div>

    <!-- MODAL DE LA GRILLE TYPE IMAGE -->
    <div id="gridModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Sélection des Kanjis (Quiz)</h3>
                <button class="close-modal-btn" onclick="closeGridModal()">✕</button>
            </div>
            <p style="font-size: 13px; color: var(--text-secondary); margin-top: 0;">Clique sur un kanji pour l'activer ou le désactiver dans le quiz.</p>
            
            <div class="kanji-grid" id="kanjiGridContainer"></div>

            <div class="modal-actions">
                <button style="background: var(--bg); color: var(--text);" onclick="setAllModalSelection(true)">Tout cocher</button>
                <button style="background: #ffe5e5; color: var(--danger);" onclick="setAllModalSelection(false)">Tout décocher</button>
                <button style="background: var(--primary); color: white;" onclick="closeGridModal()">Valider</button>
            </div>
        </div>
    </div>

    <nav>
        <button onclick="switchView('list', this)" class="active">
            <span class="icon">📖</span>Liste
        </button>
        <button onclick="switchView('add', this)"><span class="icon">➕</span>Ajouter</button>
        <button onclick="switchView('quiz', this)"><span class="icon">⚡</span>Quiz</button>
    </nav>

        let currentQuizIndex = -1;
        let lastQuizIndex = -1;
        let currentQuizLang = 'FR';
        let quizState = 'answering';
        let autoNextTimer = null;

        function saveAndRender() {
            localStorage.setItem('vocab_kanji_n5_80_v3', JSON.stringify(words));
            renderList();
        }

        function switchView(viewName, btnElement) {
            if (!btnElement) {
                const navButtons = document.querySelectorAll('nav button');
                if (viewName === 'list') btnElement = navButtons[0];
                if (viewName === 'add') btnElement = navButtons[1];
                if (viewName === 'quiz') btnElement = navButtons[2];
            }

            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            
            document.getElementById('view-' + viewName).classList.add('active');
            if (btnElement) btnElement.classList.add('active');

            const titles = { list: "📚 Kanjis JLPT N5 (80)", add: "✍️ Nouveau Kanji", quiz: "⚡ Quiz Interactif" };
            document.getElementById('headerTitle').innerText = titles[viewName];
            
            // Empêche la triche : si on change de page vers le quiz et qu'aucune question n'est active, on l'initialise. Si elle est en cours, on la garde.
            if(viewName === 'quiz' && currentQuizIndex === -1) {
                initQuiz();
            }
        }

        function renderList() {
            const listDiv = document.getElementById('wordList');
            if (words.length === 0) {
                listDiv.innerHTML = '<p style="text-align:center; color:var(--text-secondary)">Aucun kanji enregistré.</p>';
                return;
            }
            listDiv.innerHTML = '';
            words.forEach((w, index) => {
                const statusBadge = w.activeInQuiz !== false ? '<span style="color:var(--success)">● Actif</span>' : '<span style="color:var(--text-secondary)">○ Inactif</span>';
                listDiv.innerHTML += `
                    <div class="card">
                        <div class="card-content">
                            <div><span class="kanji">${w.kanji}</span><span class="kana">[${w.kana}]</span> <span style="font-size:12px; margin-left:8px;">${statusBadge}</span></div>
                            <div class="translation">${w.translation}</div>
                            <div class="card-stats">Poids - FR: ${w.weight_FR || 3} | JP: ${w.weight_JP || 3}</div>
                        </div>
                        <button class="delete-btn" onclick="deleteWord(${index})">Suppr</button>
                    </div>
                `;
            });
        }

        // --- GESTION DE LA MODALE GRILLE TYPE IMAGE ---
        function openGridModal() {
            renderGridModal();
            document.getElementById('gridModal').classList.add('active');
        }

        function closeGridModal() {
            document.getElementById('gridModal').classList.remove('active');
            saveAndRender();
        }

        function renderGridModal() {
            const gridContainer = document.getElementById('kanjiGridContainer');
            gridContainer.innerHTML = '';
            
            words.forEach((w, index) => {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                if (w.activeInQuiz !== false) {
                    cell.classList.add('selected');
                }
                cell.innerText = w.kanji;
                cell.onclick = function() {
                    w.activeInQuiz = !(w.activeInQuiz !== false);
                    if (w.activeInQuiz) {
                        cell.classList.add('selected');
                    } else {
                        cell.classList.remove('selected');
                    }
                };
                gridContainer.appendChild(cell);
            });
        }

        function setAllModalSelection(status) {
            words.forEach(w => w.activeInQuiz = status);
            renderGridModal();
        }

        function addWord() {
            const kanji = document.getElementById('kanji').value.trim();
            const kana = document.getElementById('kana').value.trim();
            const translation = document.getElementById('translation').value.trim();

            if(!kanji || !translation) {
                alert("Remplis au moins le kanji et la traduction !");
                return;
            }

            words.push({ kanji, kana, translation, weight_FR: 3, weight_JP: 3, activeInQuiz: true });
            document.getElementById('kanji').value = '';
            document.getElementById('kana').value = '';
            document.getElementById('translation').value = '';
            
            saveAndRender();
            switchView('list', document.querySelectorAll('nav button')[0]);
        }

        function deleteWord(index) {
            if(confirm("Supprimer ce kanji ?")) {
                words.splice(index, 1);
                saveAndRender();
            }
        }

        function initQuiz() {
            const activeWords = words.filter(w => w.activeInQuiz !== false);

            if (activeWords.length === 0) {
                document.getElementById('quizPromptLabel').innerText = "Attention :";
                document.getElementById('quizPrompt').innerText = "Aucun kanji coché !";
                document.getElementById('userAnswerInput').disabled = true;
                document.getElementById('quizActionBtn').disabled = true;
                document.getElementById('quizFeedback').innerText = "Ouvre la grille (icône ️ en haut à droite) pour cocher au moins un kanji.";
                return;
            }

            if (autoNextTimer) clearTimeout(autoNextTimer);
            
            quizState = 'answering';
            const btn = document.getElementById('quizActionBtn');
            btn.innerText = "Valider";
            btn.disabled = false;
            
            let nextActiveWord = null;
            let attempts = 0;
            
            while (attempts < 30) {
                currentQuizLang = Math.random() < 0.5 ? 'FR' : 'JP';
                
                let totalWeight = activeWords.reduce((sum, w) => sum + (currentQuizLang === 'FR' ? (w.weight_FR || 3) : (w.weight_JP || 3)), 0);
                let rand = Math.floor(Math.random() * totalWeight);
                let cumulative = 0;
                
                for (let i = 0; i < activeWords.length; i++) {
                    cumulative += (currentQuizLang === 'FR' ? (activeWords[i].weight_FR || 3) : (activeWords[i].weight_JP || 3));
                    if (rand < cumulative) {
                        nextActiveWord = activeWords[i];
                        break;
                    }
                }
                
                if (activeWords.length === 1 || nextActiveWord !== words[lastQuizIndex]) {
                    break;
                }
                attempts++;
            }
            
            currentQuizIndex = words.indexOf(nextActiveWord);
            lastQuizIndex = currentQuizIndex;

            const w = words[currentQuizIndex];
            if (currentQuizLang === 'FR') {
                document.getElementById('quizPromptLabel').innerText = "Traduis en français :";
                document.getElementById('quizPrompt').innerText = w.kanji;
            } else {
                document.getElementById('quizPromptLabel').innerText = "Traduis en japonais (Kanji ou Kana) :";
                document.getElementById('quizPrompt').innerText = w.translation;
            }
            
            const inputField = document.getElementById('userAnswerInput');
            inputField.value = '';
            inputField.disabled = false;
            document.getElementById('quizFeedback').innerText = '';
            setTimeout(() => inputField.focus(), 50);
        }

        function handleQuizAction() {
            const activeWords = words.filter(w => w.activeInQuiz !== false);
            if (activeWords.length === 0) return;

            if (quizState === 'answering') {
                submitAnswer();
            } else if (quizState === 'waiting_next') {
                if (autoNextTimer) clearTimeout(autoNextTimer);
                initQuiz();
            }
        }

        function submitAnswer() {
            const inputField = document.getElementById('userAnswerInput');
            const userAns = inputField.value.trim().toLowerCase();
            const w = words[currentQuizIndex];
            
            const feedback = document.getElementById('quizFeedback');

            if (currentQuizLang === 'FR') {
                const validTranslations = w.translation.toLowerCase().split(',').map(s => s.trim());
                
                if (validTranslations.length > 1) {
                    if (validTranslations.includes(userAns)) {
                        feedback.style.color = "var(--warning)";
                        feedback.innerText = `⚠️ Partiel. Autre sens : ${w.translation}`;
                        w.weight_FR = (w.weight_FR || 3) + 1;
                    } else {
                        feedback.style.color = "var(--danger)";
                        feedback.innerText = `✖ Faux. Réponse : ${w.translation}`;
                        w.weight_FR = (w.weight_FR || 3) + 2;
                    }
                } else {
                    if (userAns === validTranslations[0]) {
                        feedback.style.color = "var(--success)";
                        feedback.innerText = "✔ Correct !";
                        if (w.weight_FR > 1) w.weight_FR--;
                    } else {
                        feedback.style.color = "var(--danger)";
                        feedback.innerText = `✖ Faux. Réponse : ${w.translation}`;
                        w.weight_FR = (w.weight_FR || 3) + 2;
                    }
                }
            } else {
                const kanjiMatch = w.kanji && userAns === w.kanji.toLowerCase();
                const kanaMatch = w.kana && userAns === w.kana.toLowerCase();
                if (kanjiMatch || kanaMatch) {
                    feedback.style.color = "var(--success)";
                    feedback.innerText = "✔ Correct !";
                    if (w.weight_JP > 1) w.weight_JP--;
                } else {
                    feedback.style.color = "var(--danger)";
                    feedback.innerText = `✖ Faux. Réponse : ${w.kanji}${w.kana ? ' (' + w.kana + ')' : ''}`;
                    w.weight_JP = (w.weight_JP || 3) + 2;
                }
            }

            saveAndRender();

            quizState = 'waiting_next';
            inputField.disabled = true;
            
            const btn = document.getElementById('quizActionBtn');
            btn.disabled = true;
            btn.innerText = "Mot suivant ➔";
            
            setTimeout(() => {
                if (quizState === 'waiting_next') {
                    btn.disabled = false; 
                }
            }, 500);

            autoNextTimer = setTimeout(() => {
                if (quizState === 'waiting_next') {
                    initQuiz();
                }
            }, 3000);
        }

        document.getElementById('userAnswerInput').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                handleQuizAction();
            }
        });

        async function syncToESP32() {
            const savedIP = localStorage.getItem('esp_ip')  || "192.168.1.200";
            const espIP = prompt("Adresse IP locale de l'ESP32 :", savedIP);
            if (!espIP) return;

            localStorage.setItem('esp_ip', espIP);

            try {
                const response = await fetch(`http://${espIP}/update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(words)
                });
                
                if(response.ok) {
                    const updatedWordsFromESP = await response.json();
                    if (Array.isArray(updatedWordsFromESP)) {
                        words = updatedWordsFromESP;
                        saveAndRender();
                    }
                    alert("Synchronisation et fusion des statistiques réussies !");
                } else {
                    alert("Erreur du côté de l'ESP32.");
                }
            } catch (error) {
                alert("Impossible de joindre l'ESP32 (Vérifie le Wi-Fi local).");
            }
        }

        renderList();
    </script>
</body>
</html>
