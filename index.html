<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JapVocab Companion</title>
    <style>
        :root {
            --primary: #007aff;
            --success: #34c759;
            --warning: #ff9500;
            --danger: #ff3b30;
            --bg: #f2f2f7;
            --card-bg: #ffffff;
            --text: #1c1c1e;
            --text-secondary: #8e8e93;
            --border: #c7c7cc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 0;
            color: var(--text);
            padding-bottom: 90px;
        }

        header {
            background: var(--card-bg);
            padding: 15px 20px;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        .card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-content .kanji {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }

        .card-content .kana {
            color: var(--text-secondary);
            font-size: 14px;
            margin-left: 6px;
        }

        .card-content .translation {
            font-size: 15px;
            margin-top: 4px;
        }

        .card-stats {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        .delete-btn {
            background: #ffe5e5;
            color: var(--danger);
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-size: 16px;
            box-sizing: border-box;
            background: var(--card-bg);
            color: var(--text);
        }

        button.action-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            background: var(--primary);
            color: white;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        
        button.action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.sync-btn {
            background: var(--success);
            margin-top: 25px;
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        nav button {
            background: none;
            border: none;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        nav button.active {
            color: var(--primary);
            font-weight: 700;
        }

        nav button span.icon {
            font-size: 20px;
        }

        .quiz-box {
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.05);
        }
        .quiz-word {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary);
            margin: 20px 0;
        }
        .quiz-feedback {
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header id="headerTitle">📚 Mon Vocabulaire</header>

    <div class="container">
        
        <!-- VUE 1 : LISTE / REVISION -->
        <div id="view-list" class="view active">
            <h2>Mes mots enregistrés</h2>
            <div id="wordList"></div>
            <button class="action-btn sync-btn" onclick="syncToESP32()">🔄 Synchroniser avec l'ESP32</button>
        </div>

        <!-- VUE 2 : AJOUTER -->
        <div id="view-add" class="view">
            <h2>Ajouter un mot</h2>
            <div class="form-group">
                <label>Kanji / Japonais</label>
                <input type="text" id="kanji" placeholder="ex: 食べる">
            </div>
            <div class="form-group">
                <label>Kana (Lecture)</label>
                <input type="text" id="kana" placeholder="ex: たべる">
            </div>
            <div class="form-group">
                <label>Traduction française (Séparez les synonymes par des virgules)</label>
                <input type="text" id="translation" placeholder="ex: manger, consommer">
            </div>
            <button class="action-btn" onclick="addWord()">Enregistrer le mot</button>
        </div>

        <!-- VUE 3 : QUIZ INTERACTIF -->
        <div id="view-quiz" class="view">
            <h2>Quiz de révision</h2>
            <div class="quiz-box">
                <p style="color:var(--text-secondary)" id="quizPromptLabel">Traduis en français :</p>
                <div class="quiz-word" id="quizPrompt"></div>
                
                <div class="form-group" style="text-align: left; margin-top: 20px;">
                    <input type="text" id="userAnswerInput" placeholder="Ta réponse..." autocomplete="off">
                </div>
                <button class="action-btn" id="quizActionBtn" onclick="handleQuizAction()">Valider</button>
                <div class="quiz-feedback" id="quizFeedback"></div>
            </div>
        </div>

    </div>

    <nav>
        <button onclick="switchView('list', this)" class="active">
            <span class="icon">📖</span>Liste
        </button>
        <button onclick="switchView('add', this)"><span class="icon">➕</span>Ajouter</button>
        <button onclick="switchView('quiz', this); initQuiz();"><span class="icon">⚡</span>Quiz</button>
    </nav>

    <script>
        // Base de données initiale enrichie avec une large sélection de vocabulaire JLPT N5
        let words = JSON.parse(localStorage.getItem('vocab_words')) || [
            { kanji: "私", kana: "わたし", translation: "je, moi", weight_FR: 3, weight_JP: 3 },
            { kanji: "猫", kana: "ねこ", translation: "chat", weight_FR: 3, weight_JP: 3 },
            { kanji: "犬", kana: "いぬ", translation: "chien", weight_FR: 3, weight_JP: 3 },
            { kanji: "水", kana: "みず", translation: "eau", weight_FR: 3, weight_JP: 3 },
            { kanji: "食べる", kana: "たべる", translation: "manger", weight_FR: 3, weight_JP: 3 },
            { kanji: "飲む", kana: "のむ", translation: "boire", weight_FR: 3, weight_JP: 3 },
            { kanji: "見る", kana: "みる", translation: "voir, regarder", weight_FR: 3, weight_JP: 3 },
            { kanji: "行く", kana: "いく", translation: "aller", weight_FR: 3, weight_JP: 3 },
            { kanji: "来る", kana: "くる", translation: "venir", weight_FR: 3, weight_JP: 3 },
            { kanji: "学校", kana: "がっこう", translation: "école", weight_FR: 3, weight_JP: 3 },
            { kanji: "先生", kana: "せんせい", translation: "professeur, enseignant", weight_FR: 3, weight_JP: 3 },
            { kanji: "学生", kana: "がくせい", translation: "étudiant, élève", weight_FR: 3, weight_JP: 3 },
            { kanji: "本", kana: "ほん", translation: "livre", weight_FR: 3, weight_JP: 3 },
            { kanji: "車", kana: "くるま", translation: "voiture, automobile", weight_FR: 3, weight_JP: 3 },
            { kanji: "時間", kana: "じかん", translation: "temps, heure", weight_FR: 3, weight_JP: 3 },
            { kanji: "今日", kana: "きょう", translation: "aujourd'hui", weight_FR: 3, weight_JP: 3 },
            { kanji: "明日", kana: "あした", translation: "demain", weight_FR: 3, weight_JP: 3 },
            { kanji: "昨日", kana: "きのう", translation: "hier", weight_FR: 3, weight_JP: 3 },
            { kanji: "食べる", kana: "たべる", translation: "manger", weight_FR: 3, weight_JP: 3 },
            { kanji: "買う", kana: "かう", translation: "acheter", weight_FR: 3, weight_JP: 3 },
            { kanji: "話す", kana: "はなし", translation: "parler, discuter", weight_FR: 3, weight_JP: 3 },
            { kanji: "読む", kana: "よむ", translation: "lire", weight_FR: 3, weight_JP: 3 },
            { kanji: "書く", kana: "かく", translation: "écrire", weight_FR: 3, weight_JP: 3 },
            { kanji: "聞く", kana: "きく", translation: "écouter, entendre, demander", weight_FR: 3, weight_JP: 3 },
            { kanji: "魚", kana: "さかな", translation: "poisson", weight_FR: 3, weight_JP: 3 },
            { kanji: "肉", kana: "にく", translation: "viande", weight_FR: 3, weight_JP: 3 },
            { kanji: "野菜", kana: "やさい", translation: "légume", weight_FR: 3, weight_JP: 3 },
            { kanji: "果物", kana: "くだもの", translation: "fruit", weight_FR: 3, weight_JP: 3 },
            { kanji: "大きい", kana: "おおきい", translation: "grand", weight_FR: 3, weight_JP: 3 },
            { kanji: "小さい", kana: "ちいさい", translation: "petit", weight_FR: 3, weight_JP: 3 },
            { kanji: "新しい", kana: "あたらしい", translation: "nouveau, neuf", weight_FR: 3, weight_JP: 3 },
            { kanji: "古い", kana: "ふるい", translation: "vieux, ancien", weight_FR: 3, weight_JP: 3 },
            { kanji: "高い", kana: "たかい", translation: "haut, cher, élevé", weight_FR: 3, weight_JP: 3 },
            { kanji: "安い", kana: "やすい", translation: "bon marché, pas cher", weight_FR: 3, weight_JP: 3 },
            { kanji: "友達", kana: "ともだち", translation: "ami, copain", weight_FR: 3, weight_JP: 3 },
            { kanji: "父", kana: "ちち", translation: "père", weight_FR: 3, weight_JP: 3 },
            { kanji: "母", kana: "はは", translation: "mère", weight_FR: 3, weight_JP: 3 }
        ];

        let currentQuizIndex = 0;
        let lastQuizIndex = -1;
        let currentQuizLang = 'FR';
        let quizState = 'answering';
        let autoNextTimer = null;

        function saveAndRender() {
            localStorage.setItem('vocab_words', JSON.stringify(words));
            renderList();
        }

        function switchView(viewName, btnElement) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            
            document.getElementById('view-' + viewName).classList.add('active');
            btnElement.classList.add('active');

            const titles = { list: "📚 Mon Vocabulaire", add: "✍️ Nouveau Mot", quiz: "⚡ Quiz Interactif" };
            document.getElementById('headerTitle').innerText = titles[viewName];
            if(viewName === 'quiz') initQuiz();
        }

        function renderList() {
            const listDiv = document.getElementById('wordList');
            if (words.length === 0) {
                listDiv.innerHTML = '<p style="text-align:center; color:var(--text-secondary)">Aucun mot enregistré.</p>';
                return;
            }
            listDiv.innerHTML = '';
            words.forEach((w, index) => {
                listDiv.innerHTML += `
                    <div class="card">
                        <div class="card-content">
                            <div><span class="kanji">${w.kanji}</span><span class="kana">[${w.kana}]</span></div>
                            <div class="translation">${w.translation}</div>
                            <div class="card-stats">Poids - FR: ${w.weight_FR || 3} | JP: ${w.weight_JP || 3}</div>
                        </div>
                        <button class="delete-btn" onclick="deleteWord(${index})">Suppr</button>
                    </div>
                `;
            });
        }

        function addWord() {
            const kanji = document.getElementById('kanji').value.trim();
            const kana = document.getElementById('kana').value.trim();
            const translation = document.getElementById('translation').value.trim();

            if(!kanji || !translation) {
                alert("Remplis au moins le kanji et la traduction !");
                return;
            }

            words.push({ kanji, kana, translation, weight_FR: 3, weight_JP: 3 });
            document.getElementById('kanji').value = '';
            document.getElementById('kana').value = '';
            document.getElementById('translation').value = '';
            
            saveAndRender();
            switchView('list', document.querySelector('nav button'));
        }

        function deleteWord(index) {
            if(confirm("Supprimer ce mot ?")) {
                words.splice(index, 1);
                saveAndRender();
            }
        }

        function initQuiz() {
            if (words.length === 0) return;
            if (autoNextTimer) clearTimeout(autoNextTimer);
            
            quizState = 'answering';
            const btn = document.getElementById('quizActionBtn');
            btn.innerText = "Valider";
            btn.disabled = false;
            
            let nextIndex = -1;
            let attempts = 0;
            
            while ((nextIndex === -1 || nextIndex === lastQuizIndex) && words.length > 1 && attempts < 20) {
                currentQuizLang = Math.random() < 0.5 ? 'FR' : 'JP';
                
                let totalWeight = words.reduce((sum, w) => sum + (currentQuizLang === 'FR' ? (w.weight_FR || 3) : (w.weight_JP || 3)), 0);
                let rand = Math.floor(Math.random() * totalWeight);
                let cumulative = 0;
                
                for (let i = 0; i < words.length; i++) {
                    cumulative += (currentQuizLang === 'FR' ? (words[i].weight_FR || 3) : (words[i].weight_JP || 3));
                    if (rand < cumulative) {
                        nextIndex = i;
                        break;
                    }
                }
                attempts++;
            }
            
            currentQuizIndex = nextIndex === -1 ? 0 : nextIndex;
            lastQuizIndex = currentQuizIndex;

            const w = words[currentQuizIndex];
            if (currentQuizLang === 'FR') {
                document.getElementById('quizPromptLabel').innerText = "Traduis en français :";
                document.getElementById('quizPrompt').innerText = w.kanji;
            } else {
                document.getElementById('quizPromptLabel').innerText = "Traduis en japonais (Kanji ou Kana) :";
                document.getElementById('quizPrompt').innerText = w.translation;
            }
            
            const inputField = document.getElementById('userAnswerInput');
            inputField.value = '';
            inputField.disabled = false;
            document.getElementById('quizFeedback').innerText = '';
            setTimeout(() => inputField.focus(), 50);
        }

        function handleQuizAction() {
            if (words.length === 0) return;
            if (quizState === 'answering') {
                submitAnswer();
            } else if (quizState === 'waiting_next') {
                if (autoNextTimer) clearTimeout(autoNextTimer);
                initQuiz();
            }
        }

        function submitAnswer() {
            const inputField = document.getElementById('userAnswerInput');
            const userAns = inputField.value.trim().toLowerCase();
            const w = words[currentQuizIndex];
            
            const feedback = document.getElementById('quizFeedback');

            if (currentQuizLang === 'FR') {
                const validTranslations = w.translation.toLowerCase().split(',').map(s => s.trim());
                
                if (validTranslations.length > 1) {
                    if (validTranslations.includes(userAns)) {
                        feedback.style.color = "var(--warning)";
                        feedback.innerText = `⚠️ Partiel. Autre sens : ${w.translation}`;
                        w.weight_FR = (w.weight_FR || 3) + 1;
                    } else {
                        feedback.style.color = "var(--danger)";
                        feedback.innerText = `✖ Faux. Réponse : ${w.translation}`;
                        w.weight_FR = (w.weight_FR || 3) + 2;
                    }
                } else {
                    if (userAns === validTranslations[0]) {
                        feedback.style.color = "var(--success)";
                        feedback.innerText = "✔ Correct !";
                        if (w.weight_FR > 1) w.weight_FR--;
                    } else {
                        feedback.style.color = "var(--danger)";
                        feedback.innerText = `✖ Faux. Réponse : ${w.translation}`;
                        w.weight_FR = (w.weight_FR || 3) + 2;
                    }
                }
            } else {
                const kanjiMatch = w.kanji && userAns === w.kanji.toLowerCase();
                const kanaMatch = w.kana && userAns === w.kana.toLowerCase();
                if (kanjiMatch || kanaMatch) {
                    feedback.style.color = "var(--success)";
                    feedback.innerText = "✔ Correct !";
                    if (w.weight_JP > 1) w.weight_JP--;
                } else {
                    feedback.style.color = "var(--danger)";
                    feedback.innerText = `✖ Faux. Réponse : ${w.kanji}${w.kana ? ' (' + w.kana + ')' : ''}`;
                    w.weight_JP = (w.weight_JP || 3) + 2;
                }
            }

            saveAndRender();

            quizState = 'waiting_next';
            inputField.disabled = true;
            
            const btn = document.getElementById('quizActionBtn');
            btn.disabled = true;
            btn.innerText = "Mot suivant ➔";
            
            setTimeout(() => {
                if (quizState === 'waiting_next') {
                    btn.disabled = false; 
                }
            }, 500);

            autoNextTimer = setTimeout(() => {
                if (quizState === 'waiting_next') {
                    initQuiz();
                }
            }, 3000);
        }

        document.getElementById('userAnswerInput').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                if (quizState === 'answering') {
                    submitAnswer();
                } else if (quizState === 'waiting_next') {
                    if (autoNextTimer) clearTimeout(autoNextTimer);
                    initQuiz();
                }
            }
        });

        async function syncToESP32() {
            const savedIP = localStorage.getItem('esp_ip') || "192.168.1.200";
            const espIP = prompt("Adresse IP locale de l'ESP32 :", savedIP);
            if (!espIP) return;

            localStorage.setItem('esp_ip', espIP);

            try {
                const response = await fetch(`http://${espIP}/update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(words)
                });
                
                if(response.ok) {
                    const updatedWordsFromESP = await response.json();
                    if (Array.isArray(updatedWordsFromESP)) {
                        words = updatedWordsFromESP;
                        saveAndRender();
                    }
                    alert("Synchronisation et fusion des statistiques réussies !");
                } else {
                    alert("Erreur du côté de l'ESP32.");
                }
            } catch (error) {
                alert("Impossible de joindre l'ESP32 (Vérifie le Wi-Fi local).");
            }
        }

        renderList();
    </script>
</body>
</html>
